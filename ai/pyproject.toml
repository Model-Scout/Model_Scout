# Lint / type settings for the dataset, hypergraph and recommendation code (11-22 and helpers).
# The model pipeline (01-10) keeps its own style and is not checked here.
[tool.ruff]
line-length = 120
target-version = "py311"
include = [
    "1[1-9]_*.py", "2[0-2]_*.py", "hypergraph_search.py", "dataset_dedup.py", "taxonomy.py",
    "supabase_db.py", "project_checks.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E731"]  # small lambdas in self-checks read better than nested defs

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Model-pipeline helper owned by the model side; imported by taxonomy.py, checked there.
module = ["retrieval_metadata"]
ignore_errors = true
