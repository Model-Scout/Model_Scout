# Runs on the VPS from /opt/model-scout; deploy/deploy.sh copies this file and the data there.
services:
  # Internal only: reachable from the backend, published nowhere.
  ai:
    image: model-scout-ai:latest
    restart: unless-stopped
    env_file: .env.ai
    environment:
      ENABLE_DOCS: "1"  # Caddy puts the whole AI site behind the team login
    volumes:
      - ./data:/app/ai/data:ro
    mem_limit: 1200m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/ai/health')"]
      interval: 30s
      timeout: 5s
      start_period: 60s

  backend:
    image: model-scout-backend:latest
    restart: unless-stopped
    depends_on: [ai]
    env_file: .env.backend
    environment:
      AI_URL: http://ai:8000
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      ENABLE_DOCS: "1"  # Caddy puts /docs and /openapi.json behind the team login
      RATE_LIMIT_PER_MINUTE: "10"
      DAILY_REQUEST_LIMIT: "300"
    volumes:
      - ./data/readmes:/app/readmes:ro
    mem_limit: 300m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      start_period: 20s

  # Only Caddy publishes ports.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [backend]
    environment:
      API_DOMAIN: ${API_DOMAIN:-49-247-194-63.sslip.io}
      AI_DOMAIN: ${AI_DOMAIN:-ai.49-247-194-63.sslip.io}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docs_users:/etc/caddy/docs_users:ro
      - caddy_data:/data

volumes:
  caddy_data:
