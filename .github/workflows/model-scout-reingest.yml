name: Model Scout reingest

# Manual-only workflow. A dry-run is checkpointed across several jobs so a
# legitimate full catalog rebuild does not hit GitHub's six-hour per-job limit.
# apply never rebuilds data: it replays the exact reviewed dry-run bundle.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드"
        type: choice
        required: true
        default: validate
        options: [validate, dry-run, apply]
      stage1_mode:
        description: "Stage 1 처리 방식 (validate/apply 에서는 무시)"
        type: choice
        required: true
        default: reuse
        options: [reuse, full-scan]
      approved_run_id:
        description: "apply 전용: 검토한 dry-run run ID"
        type: string
        required: false
        default: ""
      confirm:
        description: "apply 전용: 정확히 APPLY"
        type: string
        required: false
        default: ""

concurrency:
  group: model-scout-reingest
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  PYTHON_VERSION: "3.11"
  SUPABASE_DB_BUDGET_MB: "1024"
  MODEL_SCOUT_RUN_ID: reingest-${{ github.run_id }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ai
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade -r requirements.txt
      - name: Compile the pipeline
        run: |
          python -m py_compile \
            01_collect_models.py 02_enrich_metadata.py \
            03_generate_semantic_metadata.py 04_build_embeddings.py \
            05_validate_retrieval.py 06_extract_benchmark_metadata.py \
            08_sync_supabase.py reingest_jobs.py \
            resolvers/*.py contract/*.py
      - name: Check the data contract schema and examples
        run: python contract/validate.py
      - name: Check tracked contract records
        run: |
          for pool in core low_popularity; do
            path="data/hf_models_stage2_contract_${pool}.jsonl"
            if [ -f "$path" ]; then python contract/validate.py "$path"; fi
          done
      - name: Measure coverage before the reingest
        run: |
          python contract/coverage.py --source stage2 --out reingest-coverage-before.md
          echo "## Coverage (before)" >> "$GITHUB_STEP_SUMMARY"
          awk '/^## 질문별 답변 가능률/{p=1} p&&/^## /&&!/질문별/{exit} p' reingest-coverage-before.md >> "$GITHUB_STEP_SUMMARY"
      - name: Offline retrieval checks
        run: |
          python taxonomy.py
          python project_checks.py
          python test/golden/v2/tools/verify.py --structure-only
      - name: Contract and reingest safety tests
        run: |
          python test/test_reingest_safety.py
          python test/test_contract_filters.py
          python test/test_numeric_filter_semantics.py
          python test/test_golden_v2_scan.py
          python test/test_golden_v2_structure.py
          python test/test_contract_regression_gate.py
          python test/test_reingest_bundle.py
          python test/test_reingest_jobs.py
          python -m pytest -q test/test_stage3_pool_reconciliation.py
          python test/test_lexical_rules.py
      - name: Validate mode complete
        if: ${{ inputs.mode == 'validate' }}
        run: echo "validate 완료. 외부 API와 DB는 호출하지 않았다."

  prepare:
    if: ${{ inputs.mode == 'dry-run' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: ai
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      STAGE3_LLM_MODEL: ${{ secrets.STAGE3_LLM_MODEL }}
      STAGE4_EMBEDDING_MODEL: ${{ secrets.STAGE4_EMBEDDING_MODEL }}
      SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
      SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
      SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
      SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
      SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade -r requirements.txt
      - name: Preflight external services
        run: python reingest_jobs.py preflight --output reingest-work/preflight.json
      - name: Prepare Stage 1 and frozen baseline
        shell: bash
        run: |
          args=(prepare --state reingest-work/context.json)
          if [ "${{ inputs.stage1_mode }}" = "full-scan" ]; then args+=(--full-stage1); fi
          python reingest_jobs.py "${args[@]}"
      - name: Pack the Stage 1 checkpoint
        shell: bash
        run: |
          files=(
            data/hf_models_stage1_core.jsonl
            data/hf_models_stage1_low_popularity.jsonl
            data/hf_models_stage1_likely.jsonl
            data/hf_models_stage1_fallback.jsonl
            data/hf_models_stage1_groups.jsonl
            data/hf_models_stage1_state.json
            reingest-work/context.json
            reingest-work/preflight.json
          )
          if [ -f reingest-work/contract_baseline.jsonl ]; then files+=(reingest-work/contract_baseline.jsonl); fi
          tar -czf reingest-work/stage1.tar.gz "${files[@]}"
      - name: Upload the Stage 1 checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: reingest-stage1-${{ github.run_id }}
          path: ai/reingest-work/stage1.tar.gz
          overwrite: true
          if-no-files-found: error
          retention-days: 14
      - name: Summarize preflight and Stage 1
        if: ${{ !cancelled() }}
        run: |
          echo "## Reingest preflight / Stage 1" >> "$GITHUB_STEP_SUMMARY"
          for file in reingest-work/preflight.json reingest-work/context.json; do
            if [ -f "$file" ]; then echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat "$file" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - name: Upload prepare diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: reingest-prepare-report-${{ github.run_id }}
          path: |
            ai/reingest-work/preflight.json
            ai/reingest-work/prepare-report*.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 30

  stage2:
    if: ${{ inputs.mode == 'dry-run' }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        pool: [core, low_popularity]
    defaults:
      run:
        working-directory: ai
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
      SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
      SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
      SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
      SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade -r requirements.txt
      - name: Download the Stage 1 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: reingest-stage1-${{ github.run_id }}
          path: ai/reingest-work/input
      - name: Restore the Stage 1 checkpoint
        run: tar -xzf reingest-work/input/stage1.tar.gz -C .
      - name: Enrich Stage 2 pool
        run: python reingest_jobs.py stage2 --pool "${{ matrix.pool }}" --state reingest-work/context.json
      - name: Pack the Stage 2 pool checkpoint
        shell: bash
        run: |
          pool="${{ matrix.pool }}"
          files=(
            "data/hf_models_stage2_${pool}.jsonl"
            "data/hf_models_stage2_contract_${pool}.jsonl"
            "data/readmes/${pool}"
            "reingest-work/stage2_${pool}.json"
          )
          report="data/hf_models_stage2_${pool}_language_excluded.json"
          if [ -f "$report" ]; then files+=("$report"); fi
          tar -czf "reingest-work/stage2-${pool}.tar.gz" "${files[@]}"
      - name: Upload the Stage 2 pool checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: reingest-stage2-${{ matrix.pool }}-${{ github.run_id }}
          path: ai/reingest-work/stage2-${{ matrix.pool }}.tar.gz
          overwrite: true
          if-no-files-found: error
          retention-days: 14
      - name: Summarize Stage 2 pool
        run: |
          echo "## Stage 2 — ${{ matrix.pool }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "reingest-work/stage2_${{ matrix.pool }}.json" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  stage3:
    if: ${{ inputs.mode == 'dry-run' }}
    needs: stage2
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: ai
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      STAGE3_LLM_MODEL: ${{ secrets.STAGE3_LLM_MODEL }}
      SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
      SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
      SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
      SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
      SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade -r requirements.txt
      - name: Download the Stage 1 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: reingest-stage1-${{ github.run_id }}
          path: ai/reingest-work/stage1
      - name: Download the Core Stage 2 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: reingest-stage2-core-${{ github.run_id }}
          path: ai/reingest-work/core
      - name: Download the Low Stage 2 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: reingest-stage2-low_popularity-${{ github.run_id }}
          path: ai/reingest-work/low
      - name: Restore the checkpointed inputs
        run: |
          tar -xzf reingest-work/stage1/stage1.tar.gz -C .
          tar -xzf reingest-work/core/stage2-core.tar.gz -C .
          tar -xzf reingest-work/low/stage2-low_popularity.tar.gz -C .
      - name: Run Stage 3
        run: python reingest_jobs.py stage3 --state reingest-work/context.json --output reingest-work/stage3.json
      - name: Pack the Stage 3 checkpoint
        run: |
          tar -czf reingest-work/stage3.tar.gz \
            data/hf_models_stage3_core.jsonl \
            data/hf_models_stage3_low_popularity.jsonl \
            data/hf_models_stage3_parent_child_core.jsonl \
            data/hf_models_stage3_parent_child_low_popularity.jsonl \
            data/hf_models_stage3_parent_child_manifest.json \
            reingest-work/stage3.json \
            reingest-work/stage3-metrics.json
      - name: Upload the Stage 3 checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: reingest-stage3-${{ github.run_id }}
          path: ai/reingest-work/stage3.tar.gz
          overwrite: true
          if-no-files-found: error
          retention-days: 14
      - name: Summarize Stage 3 API usage
        if: ${{ !cancelled() }}
        run: |
          echo "## Stage 3 API usage" >> "$GITHUB_STEP_SUMMARY"
          if [ -f reingest-work/stage3-metrics.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat reingest-work/stage3-metrics.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Stage 3 metrics were not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

  finalize:
    if: ${{ inputs.mode == 'dry-run' }}
    needs: stage3
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: ai
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      STAGE3_LLM_MODEL: ${{ secrets.STAGE3_LLM_MODEL }}
      STAGE4_EMBEDDING_MODEL: ${{ secrets.STAGE4_EMBEDDING_MODEL }}
      SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
      SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
      SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
      SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
      SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade -r requirements.txt
      - name: Download the Stage 1 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: reingest-stage1-${{ github.run_id }}
          path: ai/reingest-work/stage1
      - name: Download the Core Stage 2 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: reingest-stage2-core-${{ github.run_id }}
          path: ai/reingest-work/core
      - name: Download the Low Stage 2 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: reingest-stage2-low_popularity-${{ github.run_id }}
          path: ai/reingest-work/low
      - name: Download the Stage 3 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: reingest-stage3-${{ github.run_id }}
          path: ai/reingest-work/stage3
      - name: Restore the checkpointed inputs
        run: |
          tar -xzf reingest-work/stage1/stage1.tar.gz -C .
          tar -xzf reingest-work/core/stage2-core.tar.gz -C .
          tar -xzf reingest-work/low/stage2-low_popularity.tar.gz -C .
          tar -xzf reingest-work/stage3/stage3.tar.gz -C .
      - name: Run Stage 4 and benchmark integration
        run: python reingest_jobs.py finalize --state reingest-work/context.json --output reingest-work/refresh-info.json
      - name: Validate and build the reviewed dry-run bundle
        run: |
          python 08_sync_supabase.py \
            --reingest \
            --reingest-state reingest-work/refresh-info.json \
            --report reingest-report.json \
            --bundle-dir reingest-bundle
      - name: Upload the dry-run bundle
        uses: actions/upload-artifact@v4
        with:
          name: reingest-bundle-${{ github.run_id }}
          path: ai/reingest-bundle
          overwrite: true
          if-no-files-found: error
          retention-days: 14
      - name: Measure coverage after the reingest
        run: |
          python contract/coverage.py --source stage2 --out reingest-coverage-after.md
          echo "## Coverage (after)" >> "$GITHUB_STEP_SUMMARY"
          awk '/^## 질문별 답변 가능률/{p=1} p&&/^## /&&!/질문별/{exit} p' reingest-coverage-after.md >> "$GITHUB_STEP_SUMMARY"
      - name: Summarize API usage and the reingest
        if: ${{ !cancelled() }}
        run: |
          for file in reingest-work/stage3-metrics.json reingest-work/stage4-metrics.json reingest-report.summary.json; do
            if [ -f "$file" ]; then
              echo "## $(basename "$file")" >> "$GITHUB_STEP_SUMMARY"
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              cat "$file" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Upload the reingest report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reingest-report-dry-run-${{ inputs.stage1_mode }}-${{ github.run_id }}
          path: |
            ai/reingest-report*.json
            ai/reingest-coverage-*.md
            ai/reingest-work/*-metrics.json
            ai/data/hf_models_stage4_manifest.json
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

  apply:
    if: ${{ inputs.mode == 'apply' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: ai
    env:
      SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
      SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
      SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
      SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
      SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard the apply mode
        shell: bash
        run: |
          if [ "${{ inputs.confirm }}" != "APPLY" ]; then echo "confirm must be APPLY" >&2; exit 1; fi
          if [ "${{ github.ref_name }}" != "main" ]; then echo "apply must run on main" >&2; exit 1; fi
          if ! printf '%s' "${{ inputs.approved_run_id }}" | grep -Eq '^[0-9]+$'; then echo "approved_run_id is required" >&2; exit 1; fi
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade -r requirements.txt
      - name: Download the approved dry-run bundle
        uses: actions/download-artifact@v4
        with:
          name: reingest-bundle-${{ inputs.approved_run_id }}
          path: ai/reingest-bundle
          run-id: ${{ inputs.approved_run_id }}
          github-token: ${{ github.token }}
      - name: Apply the reviewed bundle to Supabase
        run: |
          python 08_sync_supabase.py \
            --reingest --apply \
            --from-bundle reingest-bundle \
            --approved-run-id "${{ inputs.approved_run_id }}" \
            --report reingest-report.json
      - name: Measure coverage after apply
        run: |
          python contract/coverage.py --source stage2 --out reingest-coverage-after.md
          echo "## Coverage (applied)" >> "$GITHUB_STEP_SUMMARY"
          awk '/^## 질문별 답변 가능률/{p=1} p&&/^## /&&!/질문별/{exit} p' reingest-coverage-after.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the apply report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reingest-report-apply-${{ github.run_id }}
          path: |
            ai/reingest-report*.json
            ai/reingest-coverage-*.md
            ai/data/hf_models_stage4_manifest.json
          if-no-files-found: warn
          overwrite: true
          retention-days: 30
      - name: Persist snapshots after apply
        run: |
          git config user.name "model-scout-sync[bot]"
          git config user.email "model-scout-sync[bot]@users.noreply.github.com"
          git add \
            data/hf_models_stage1_core.jsonl \
            data/hf_models_stage1_low_popularity.jsonl \
            data/hf_models_stage1_likely.jsonl \
            data/hf_models_stage1_fallback.jsonl \
            data/hf_models_stage1_groups.jsonl \
            data/hf_models_stage1_state.json \
            data/hf_models_stage2_core.jsonl \
            data/hf_models_stage2_low_popularity.jsonl \
            data/hf_models_stage2_contract_core.jsonl \
            data/hf_models_stage2_contract_low_popularity.jsonl \
            data/hf_models_stage3_core.jsonl \
            data/hf_models_stage3_low_popularity.jsonl \
            data/hf_models_stage3_parent_child_core.jsonl \
            data/hf_models_stage3_parent_child_low_popularity.jsonl \
            data/hf_models_stage4_manifest.json \
            data/readmes/core \
            data/readmes/low_popularity
          if test -f data/hf_models_benchmark_state.json; then git add data/hf_models_benchmark_state.json; fi
          if test -f data/hf_models_stage3_parent_child_manifest.json; then git add data/hf_models_stage3_parent_child_manifest.json; fi
          for f in data/hf_models_stage2_*_language_excluded.json; do if test -f "$f"; then git add "$f"; fi; done
          if git diff --cached --quiet; then echo "커밋할 변경 없음"; exit 0; fi
          git commit -m "chore: persist Model Scout reingest snapshot (run ${{ github.run_id }}, approved dry-run ${{ inputs.approved_run_id }})"
          for attempt in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done
          echo "snapshot push failed after DB apply; push this run's commit manually" >&2
          exit 1
