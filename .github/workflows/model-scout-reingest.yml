name: Model Scout reingest

# 자동 실행이 없다. schedule 을 두지 않는다 — 팀 결정으로 모델 자동화는
# 멈춘 상태이고, 이 워크플로는 처음부터 수동 전용으로 만든다.
#
# 세 모드를 둔다. 왼쪽부터 비용이 올라간다.
#
#   validate  API 호출 없음. 스키마와 기존 데이터만 검사한다. PR 에서 돌린다
#   dry-run   HF 수집·재생성은 하되 DB 는 건드리지 않는다. diff 리포트만 낸다
#   apply     Supabase 를 갱신한다. 팀이 dry-run 리포트를 확인한 뒤 한 번만
#
# apply 는 브랜치에서 돌리지 않는다. PR 검토 → main 병합 → 수동 1회다.
#
# stage1_mode 는 dry-run/apply 에서 Stage 1 을 어떻게 다룰지 정한다.
#
#   reuse      저장소의 Stage 1 을 그대로 쓴다(기본). watermark 를 물려받는다
#   full-scan  Stage 1 을 Hugging Face 에서 처음부터 다시 수집한다. 수집은
#              08_sync_supabase.py --full-stage1 안에서 돈다 — Stage 1 diff,
#              비활성화 후보, watermark(스캔 시작 시각)가 한 실행에 묶여야 한다
#
# 운영 절차는 ai/MODEL_REINGEST_RUNBOOK.md 에 있다.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드"
        type: choice
        required: true
        default: validate
        options:
          - validate
          - dry-run
          - apply
      stage1_mode:
        description: "Stage 1 처리 방식 (validate 에서는 무시)"
        type: choice
        required: true
        default: reuse
        options:
          - reuse
          - full-scan
      confirm:
        description: "apply 모드에서만: 정확히 APPLY 라고 입력"
        type: string
        required: false
        default: ""

concurrency:
  group: model-scout-reingest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # apply 는 되돌리기 어렵다. 모드를 잘못 고른 실행을 여기서 끊는다.
      - name: Guard the apply mode
        if: ${{ inputs.mode == 'apply' }}
        run: |
          if [ "${{ inputs.confirm }}" != "APPLY" ]; then
            echo "apply 모드는 confirm 입력이 정확히 APPLY 여야 합니다." >&2
            exit 1
          fi
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "apply 는 main 에서만 실행합니다. 현재: ${{ github.ref_name }}" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade -r requirements.txt

      # ── validate: 비용 0 ────────────────────────────────────────────────
      - name: Compile the pipeline
        run: |
          python -m py_compile \
            01_collect_models.py 02_enrich_metadata.py \
            03_generate_semantic_metadata.py 04_build_embeddings.py \
            05_validate_retrieval.py 08_sync_supabase.py \
            resolvers/*.py contract/*.py

      - name: Check the data contract schema and examples
        run: python contract/validate.py

      - name: Check contract records if Stage 2 already produced them
        run: |
          for pool in core low_popularity; do
            path="data/hf_models_stage2_contract_${pool}.jsonl"
            if [ -f "$path" ]; then
              echo "== $path"
              python contract/validate.py "$path"
            else
              echo "== $path 없음 (아직 재적재 전)"
            fi
          done

      - name: Measure coverage before the reingest
        run: |
          python contract/coverage.py --compare --out contract/baseline.md
          echo "## Coverage (before)" >> "$GITHUB_STEP_SUMMARY"
          sed -n '/질문별 답변 가능률/,/읽는 법/p' contract/baseline.md >> "$GITHUB_STEP_SUMMARY"

      - name: Offline retrieval checks
        run: |
          python taxonomy.py
          python project_checks.py
          python test/golden/v2/tools/verify.py

      # 재적재 안전장치와 필터 의미는 조용히 틀리는 종류라 테스트가 1차 방어선이다.
      # watermark 전진 / 언어 제외분 누락 / 대량 실패 통과 / unknown 을 "가능"으로
      # 보여주는 것은 전부 실행은 성공하고 숫자만 어긋난다.
      - name: Contract and reingest safety tests
        run: |
          python test/test_reingest_safety.py
          python test/test_contract_filters.py
          python test/test_numeric_filter_semantics.py
          python test/test_golden_v2_scan.py
          python test/test_lexical_rules.py
          # test_benchmark_metadata.py 는 넣지 않는다. main 에서도 실패한다 —
          # stage2 3,872 행과 stage4 3,853 행의 19 행 차이를 동등으로 보는
          # 단정 때문이고, 이 작업과 무관한 기존 문제다.

      - name: Stop here in validate mode
        if: ${{ inputs.mode == 'validate' }}
        run: echo "validate 모드 종료. HF·LLM·임베딩·DB 호출 없음."

      # ── dry-run / apply ────────────────────────────────────────────────
      # --reingest 는 --apply 없이 돌면 DB 를 읽기만 하고 리포트만 낸다.
      # 결과 JSON 은 --report 로 따로 쓴다. 예전처럼 stdout 을 tee 로 받으면
      # 하위 프로세스 로그가 섞여 JSON 이 아니고, pipefail 이 없어 실패해도
      # 다음 단계(스냅샷 커밋)로 넘어간다. shell: bash 를 명시하면 pipefail 이 켜진다.
      - name: Run the reingest
        if: ${{ inputs.mode != 'validate' }}
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          STAGE3_LLM_MODEL: ${{ secrets.STAGE3_LLM_MODEL }}
          STAGE4_EMBEDDING_MODEL: ${{ secrets.STAGE4_EMBEDDING_MODEL }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          MODEL_SCOUT_RUN_ID: reingest-${{ github.run_id }}
          # 데이터셋 쪽(dataset-refresh.yml)과 같은 한도. 같은 무료 DB(500MB)를 나눠 쓴다.
          SUPABASE_DB_BUDGET_MB: "480"
        run: |
          args=(--reingest --report reingest-report.json)
          if [ "${{ inputs.stage1_mode }}" = "full-scan" ]; then
            args+=(--full-stage1)
          fi
          if [ "${{ inputs.mode }}" = "apply" ]; then
            args+=(--apply)
          fi
          python 08_sync_supabase.py "${args[@]}"

      # 수치만 Summary 에 둔다. ID 전체 목록은 artifact 의 JSON 에 있다.
      # dry-run 이 비활성화 가드로 멈춰도(종료 코드 3) 보고서는 남긴다.
      - name: Summarize the reingest
        if: ${{ !cancelled() && inputs.mode != 'validate' }}
        run: |
          if [ -f reingest-report.summary.json ]; then
            {
              echo "## Reingest (${{ inputs.mode }}, stage1=${{ inputs.stage1_mode }})"
              echo '```json'
              cat reingest-report.summary.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Reingest 보고서 없음 — 로그를 확인한다" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Measure coverage after the reingest
        if: ${{ inputs.mode != 'validate' }}
        run: |
          python contract/coverage.py --compare --out contract/baseline.md
          echo "## Coverage (after)" >> "$GITHUB_STEP_SUMMARY"
          sed -n '/질문별 답변 가능률/,/읽는 법/p' contract/baseline.md >> "$GITHUB_STEP_SUMMARY"

      # 감사 자료: 보고서(Stage 1 diff·비활성화 후보 포함), 계약 coverage,
      # Stage 4 manifest. Stage 1~4 전체 스냅샷은 수백 MB 라 올리지 않는다 —
      # 필요해지면 별도 입력으로 켜는 후속 작업이다(RUNBOOK 참고).
      - name: Upload the reingest report
        if: ${{ !cancelled() && inputs.mode != 'validate' }}
        uses: actions/upload-artifact@v4
        with:
          name: reingest-report-${{ inputs.mode }}-${{ inputs.stage1_mode }}-${{ github.run_id }}
          path: |
            ai/reingest-report*.json
            ai/contract/baseline.md
            ai/data/hf_models_stage4_manifest.json
          if-no-files-found: warn
          retention-days: 30

      # dry-run 은 커밋하지 않는다. 재생성된 스냅샷은 apply 가 확정된 뒤에만 남긴다.
      # 앞 단계가 실패하면 이 단계는 돌지 않는다(if 에 상태 함수가 없으면 success() 가 붙는다).
      # Stage 1 파일은 reuse 에서는 바뀌지 않아 커밋할 것이 없고, full-scan 에서는
      # 다음 --refresh 의 기준이 된다. Stage 4 jsonl(LFS, 대용량)은 넣지 않는다.
      - name: Persist snapshots after apply
        if: ${{ inputs.mode == 'apply' }}
        run: |
          git config user.name "model-scout-sync[bot]"
          git config user.email "model-scout-sync[bot]@users.noreply.github.com"
          git add \
            data/hf_models_stage1_core.jsonl \
            data/hf_models_stage1_low_popularity.jsonl \
            data/hf_models_stage1_likely.jsonl \
            data/hf_models_stage1_fallback.jsonl \
            data/hf_models_stage1_groups.jsonl \
            data/hf_models_stage1_state.json \
            data/hf_models_stage2_core.jsonl \
            data/hf_models_stage2_low_popularity.jsonl \
            data/hf_models_stage2_contract_core.jsonl \
            data/hf_models_stage2_contract_low_popularity.jsonl \
            data/hf_models_stage3_core.jsonl \
            data/hf_models_stage3_low_popularity.jsonl \
            data/hf_models_stage4_manifest.json \
            data/readmes/core \
            data/readmes/low_popularity \
            contract/baseline.md
          if test -f data/hf_models_benchmark_state.json; then git add data/hf_models_benchmark_state.json; fi
          for f in data/hf_models_stage2_*_language_excluded.json; do if test -f "$f"; then git add "$f"; fi; done
          if git diff --cached --quiet; then
            echo "커밋할 변경 없음"
            exit 0
          fi
          git commit -m "chore: persist Model Scout reingest snapshot (run ${{ github.run_id }})"
          # full-scan 은 몇 시간 걸려 그사이 main 이 움직일 수 있다. DB 는 이미 새 스냅샷
          # 기준이므로 push 를 한 번 실패하고 끝내면 저장소의 Stage 1~3 과 DB 가 어긋난다.
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 10
          done
          echo "스냅샷 push 실패. DB 는 반영됐다 — 이 run 의 커밋을 수동으로 올려야 한다" >&2
          exit 1
