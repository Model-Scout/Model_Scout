name: Dataset refresh

# Keeps the dataset hypergraph, vector index and wiki in step with new models and datasets.
#   daily   rebuild: models added by the incremental model sync join the hypergraph and wiki
#   weekly  full: re-collect HF / Kaggle / 서울 열린데이터광장 / 공공데이터포털, NER new cards, rebuild
# Nothing is published unless every gate passes (self-checks, wiki links, ranking floor, budget).
on:
  schedule:
    - cron: "0 19 * * *"   # 04:00 KST daily: rebuild
    - cron: "30 17 * * 0"  # 02:30 KST Monday: full collection
  workflow_dispatch:
    inputs:
      mode:
        description: rebuild (graph, index, wiki) or full (collect first)
        type: choice
        options: [rebuild, full]
        default: rebuild

concurrency:
  group: dataset-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    timeout-minutes: 150
    env:
      FULL: ${{ github.event.schedule == '30 17 * * 0' || inputs.mode == 'full' }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      SEOUL_OPEN_API_KEY: ${{ secrets.SEOUL_OPEN_API_KEY }}
      DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
      SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
      SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
      SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
      SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
      SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
      SUPABASE_DB_BUDGET_MB: "480"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai/requirements.txt

      - name: Install
        run: python -m pip install --upgrade -r requirements.txt

      # Raw portal catalogs and per-item lookups (licenses, field schemas) are gitignored;
      # restoring them makes a weekly run fetch only what changed.
      - name: Restore public-catalog cache
        if: env.FULL == 'true'
        uses: actions/cache@v4
        with:
          path: ai/data/public_catalog
          key: public-catalog-${{ github.run_id }}
          restore-keys: public-catalog-

      - name: Collect datasets (weekly)
        if: env.FULL == 'true'
        run: |
          python 11_collect_hf_datasets.py --workers 8
          python 12_collect_dataset_length_stats.py --workers 6
          python 19_collect_kaggle_datasets.py
          python 18_collect_public_datasets.py --source all
          python 13_build_hypergraph.py --model-source supabase
          python 14_build_dataset_chunks.py
          python 16_extract_dataset_ner.py --workers 8

      # The model corpus is the active rows in Supabase, what the recommendation search can return.
      # Stage 4 files are Git LFS stubs in this checkout, and an old local snapshot could disagree
      # with the table, so 13 is told not to look at them. 14 reuses published vectors so only new
      # or changed chunks are embedded.
      - name: Rebuild hypergraph, index and wiki
        run: |
          python 13_build_hypergraph.py --model-source supabase
          python 14_build_dataset_chunks.py --embed
          python 15_build_wiki.py

      - name: Record the model corpus
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          report = json.load(open("data/hypergraph/report.json", encoding="utf-8"))
          models = report["models"]
          print("## Hypergraph model corpus")
          print(f"- source: {models['source']} (requested {models['requested_source']})")
          print(f"- active models read: {models['count']}")
          print(f"- model entities: {report['entities'].get('model', 0)}")
          print(f"- model_ids_sha256: `{models['model_ids_sha256']}`")
          PY

      - name: Quality gates
        run: |
          for f in 13_build_hypergraph.py 14_build_dataset_chunks.py 15_build_wiki.py 16_extract_dataset_ner.py 20_sync_dataset_index.py; do
            python "$f" --self-check
          done
          python 15_build_wiki.py --check
          python 22_eval_recommendations.py --min-p10 0.65
          python 20_sync_dataset_index.py

      - name: Publish vectors to Supabase
        run: python 20_sync_dataset_index.py --apply

      # wiki/ is gitignored; wiki-pages.yml rebuilds it from the committed hypergraph.
      - name: Commit data
        run: |
          git config user.name "model-scout-sync[bot]"
          git config user.email "model-scout-sync[bot]@users.noreply.github.com"
          git add data/hypergraph data/dataset_index/chunks.jsonl data/dataset_index/manifest.json \
                  data/hf_datasets_stage1.jsonl data/hf_datasets_stage1_state.json data/hf_datasets_length_stats.jsonl \
                  data/hf_datasets_ner.jsonl data/kaggle_datasets_stage1.jsonl data/public_datasets_stage1.jsonl \
                  data/readmes/datasets data/readmes/kaggle data/readmes/public
          if git diff --cached --quiet; then
            echo "No dataset changes"
            exit 0
          fi
          git commit -m "chore: refresh dataset hypergraph and index"
          for attempt in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 10
          done
          exit 1
