name: Model Scout incremental sync

# 자동 실행을 멈춘다. 팀 결정이며, 설정만이 아니라 파일에서도 지운다 —
# UI 에서만 꺼 두면 다음 사람이 이 파일을 보고 "매시간 돈다"고 읽는다.
#
# 모델 데이터 재적재는 model-scout-reingest.yml 로 옮겼다. 그쪽은
# validate / dry-run / apply 세 모드를 두고 apply 는 main 에서 수동 1회다.
#
# 자동화를 다시 켤 때는 아래 두 줄을 되살린다.
#   schedule:
#     - cron: "0 * * * *"   # UTC. 비싼 단계는 24시간 TTL 로 하루 1회만 돈다
on:
  workflow_dispatch:

concurrency:
  group: model-scout-incremental-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  incremental-sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    timeout-minutes: 90
    steps:
      - name: Checkout persisted pipeline state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Stage 4 vectors are restored from Supabase when a change exists.
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai/requirements.txt

      - name: Install pipeline dependencies
        run: python -m pip install --upgrade -r requirements.txt

      - name: Validate pipeline before paid stages
        run: |
          python -m py_compile 01_collect_models.py 02_enrich_metadata.py 03_generate_semantic_metadata.py 04_build_embeddings.py 08_sync_supabase.py
          python 04_build_embeddings.py --help | grep -q -- "--backfill-search-metadata"
          python 04_build_embeddings.py --pool all

      - name: Run TTL-gated incremental pipeline
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          STAGE3_LLM_MODEL: ${{ secrets.STAGE3_LLM_MODEL }}
          STAGE4_EMBEDDING_MODEL: ${{ secrets.STAGE4_EMBEDDING_MODEL }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          MODEL_SCOUT_TTL_HOURS: "24"
        run: python 08_sync_supabase.py --refresh --apply

      - name: Persist Stage 1-3 snapshots and Stage 4 manifest
        run: |
          git config user.name "model-scout-sync[bot]"
          git config user.email "model-scout-sync[bot]@users.noreply.github.com"
          git add \
            data/hf_models_stage1_*.jsonl \
            data/hf_models_stage1_state.json \
            data/hf_models_stage2_core.jsonl \
            data/hf_models_stage2_low_popularity.jsonl \
            data/hf_models_stage3_core.jsonl \
            data/hf_models_stage3_low_popularity.jsonl \
          data/hf_models_stage4_manifest.json \
          data/readmes/core \
          data/readmes/low_popularity
          if test -f data/hf_models_benchmark_state.json; then git add data/hf_models_benchmark_state.json; fi
          # Stage 2 language-gate exclusions; persisted so excluded models are not re-enriched each run.
          for f in data/hf_models_stage2_*_language_excluded.json; do if test -f "$f"; then git add "$f"; fi; done
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit"
            exit 0
          fi
          git commit -m "chore: persist incremental Model Scout snapshot"
          git push
